# game-dock -- one game per line: Label|command
#
# The line order is the number you press in the dock. Add, remove or reorder
# freely; game-dock reads this file every time it opens.
#
# Lutris games are launched by id. The ids on this machine:
#   3  GTA SA MODDED
#   4  GTA SA (Opti V3.1)
#   5  PES 2013
#   7  PES 2013 (Original 1.4)
#
# Minecraft goes through Prism Launcher, not Lutris; DRAFTOUT is the instance
# id (the folder name under ~/.local/share/PrismLauncher/instances/).

Minecraft|prismlauncher --launch DRAFTOUT
PES 2013|"$HOME/.local/bin/lutris" lutris:rungameid/5
PES 2013 (Original 1.4)|"$HOME/.local/bin/lutris" lutris:rungameid/7
GTA SA MODDED|"$HOME/.local/bin/lutris" lutris:rungameid/3
GTA SA (Opti V3.1)|"$HOME/.local/bin/lutris" lutris:rungameid/4
