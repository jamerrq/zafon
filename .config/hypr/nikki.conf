decoration {
    rounding = 10
}

general {
    border_size = 4
}

input {
    kb_layout = latam
}

## !IMPORTANT
## to search for keybindings use:
## omarchy-menu-keybindings -p | grep -i 'pattern'
## example patterns: SUPER U, SUPER SHIFT + P

# suspend
bindd = SUPER SHIFT, S, Suspend, exec, systemctl suspend

# media keys
bindd = , XF86HomePage, Omarchy menu, exec, omarchy-menu
bindd = , XF86Mail, Email, exec, omarchy-launch-browser

# apps
bindd = SUPER SHIFT, L, Lichess, exec, omarchy-launch-webapp "lichess.org"
bindd = SUPER SHIFT, Z, Antigravity, exec, antigravity --disable-gpu

# monitors
bind = SUPER, U, focusmonitor, +1          ## change focus
bind = SUPER SHIFT, U, movewindow, mon:+1  ## move window (also change focus)
# added that to mimic i3's behavior
# where pushing a workspace to another monitor also focuses it
bind = SUPER CTRL, P,  movecurrentworkspacetomonitor, +1
bind = SUPER CTRL, P, focusmonitor, +1
## order
monitor = HDMI-A-2, 1920x1080@75, 0x0, 1
monitor = HDMI-A-1, 1920x1080@100, 1920x0, 1
