decoration {
    rounding_power = 3
    rounding = 10
}

# virt manager 100% opacity
windowrule = opacity 1, title:^(.* on QEMU/KVM)$
windowrule = opacity 1, class:scrcpy
windowrule = opacity 1, title:^.*Kick.*$

# media keys
bindd = , XF86HomePage, Omarchy menu, exec, omarchy-menu
bindd = , XF86Mail, Email, exec, omarchy-launch-browser
bindd = , XF86Tools, Bluetooth, exec, ~/dev/scripts/bash/toggle-bluetooth.sh
# bindd = ,
# bindld = , XF86Calculator

# floating default size
windowrule = size 960 540, floating:1
windowrule = size 960 540, title:^Minecraft Launcher$

# web apps
bindd = SUPER, L, Lichess, exec, omarchy-launch-webapp "https://lichess.org"
bindd = SUPER, Z, Cursor, exec, cursor
bindd = SUPER SHIFT, Z, Code, exec, code
