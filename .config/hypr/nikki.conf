misc {
    allow_session_lock_restore = true  # allows hyprlock to re-lock after crash
}

decoration {
    rounding = 10
}

general {
    border_size = 4
}

input {
    kb_layout = latam
}

## !IMPORTANT
## to search for keybindings use:
## omarchy-menu-keybindings -p | grep -i 'pattern'
## example patterns: SUPER U, SUPER SHIFT + P

# Hyprland
bind = SUPER , E, exec, quickshell ipc -p ~/dev/skwd-wall/daemon.qml call wallpaper toggle

# suspend
bindd = SUPER SHIFT, S, Suspend, exec, systemctl suspend

# media keys
bindd = , XF86HomePage, Pop terminal, exec, ~/.config/yadm/scripts/launch-pop-terminal.sh
bindd = , XF86Mail, Email, exec, omarchy-launch-browser
bindd = SUPER, XF86Calculator, Toggle bluetooth, exec, ~/.config/yadm/scripts/toggle-bluetooth.sh
bindd = SUPER CTRL, XF86Calculator, Launch GTA San Andreas, exec, steam steam://rungameid/15914524561106796544

# apps
bindd = SUPER SHIFT, L, Lichess, exec, omarchy-launch-webapp "https://lichess.org"
bindd = SUPER SHIFT, Z, Antigravity, exec, antigravity --disable-gpu

# brightness (for desktop)
# Call the script directly rather than via `omarchy brightness display`: the
# dispatcher execs $OMARCHY_BIN_DIR/<binary> by absolute path, so it ignores
# PATH and would bypass our ~/.local/bin override.
bindd = SUPER, XF86AudioLowerVolume, Reduce Brightness (5%), exec, omarchy-brightness-display 5%-
bindd = SUPER, XF86AudioRaiseVolume, Raise Brightness (5%), exec, omarchy-brightness-display +5%

# monitors
bind = SUPER, U, focusmonitor, +1          ## change focus
bind = SUPER SHIFT, U, movewindow, mon:+1  ## move window (also change focus)
# added that to mimic i3's behavior
# where pushing a workspace to another monitor also focuses it
bind = SUPER CTRL, P, movecurrentworkspacetomonitor, +1
bind = SUPER CTRL, P, focusmonitor, +1
## order
monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
monitor = HDMI-A-2, 1920x1080@100, 1920x0, 1
## credits
## reddit.com/r/hyprland/comments/1ak1pta/move_workspace_to_another_monitor/

# window management
bindd = SUPER, Q, Force kill active window, exec, ~/.config/yadm/scripts/force-kill-active.sh
bindd = SUPER CTRL, Q, Restart active window, exec, ~/.config/yadm/scripts/restart-active.sh

