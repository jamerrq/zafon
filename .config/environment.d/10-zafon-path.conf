# Put ~/.local/bin ahead of ~/.local/share/omarchy/bin on PATH.
#
# Omarchy adds its own bin/ to the session PATH, but that directory is a git
# checkout of basecamp/omarchy -- editing scripts in place means omarchy-update
# clobbers them. Instead, patched copies live in yadm (~/.config/yadm/omarchy/bin)
# and are symlinked into ~/.local/bin, which wins by PATH precedence while the
# upstream clone stays pristine.
#
# NOTE: this does NOT govern the Hyprland session. Omarchy launches Hyprland via
# uwsm, which sources ~/.config/uwsm/env and pushes the result into the systemd
# user manager after these generators run, overwriting PATH wholesale. The real
# ordering for the desktop session is set there; this file only covers plain
# systemd user services started outside a uwsm session.
PATH=$HOME/.local/bin:$HOME/bin:$PATH
